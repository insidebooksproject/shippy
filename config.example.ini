; Template for config.ini, read by both apps (see README.md, Configuration):
;   shippy --config path\to\config.ini bulk|individual|manual
;   shippy-gui    (reads config.ini in the folder it is started in)
; The shippy CLI ignores [ui]. shippy-gui bundles its own copy of this
; template (src/shippy/gui/config.example.ini) to create a missing config.ini.
; Real keys belong only in config.ini, which is never committed.

; shippy-gui only.
[ui]
font_size = 11
log_file = shippy.log
default_weight = 3

; Base URL of the IBP backend API. No API key is needed. Both forms work:
;   - behind nginx: http://192.168.1.156/api
;   - direct:       http://localhost:8000
; The return address and the unit (bulk) recipient name are not configured
; here: they come from the server's shipping settings (GET /shipping-settings),
; which volunteers can edit in the IBP web app.
[ibp]
url = http://192.168.1.156/api

[easypost]
apikey = YOUR_EASYPOST_API_KEY

; Address autocompletion (shippy-gui, and the CLI's manual mode). The section
; is required by both apps.
[googlemaps]
apikey = YOUR_GOOGLE_MAPS_API_KEY

; Declared parcel dimensions in inches. USPS requires all three dimensions;
; Library Mail is priced by weight alone, so these just need to be large
; enough for any package. This section is optional and defaults to the
; values shown below. small_length, small_width and small_height (default
; 12 x 12 x 12) are the box declared when the volunteer says the box is small:
; whole inches, exactly 1,728 cubic inches, no side over 22.
[parcel]
length = 20
width = 14
height = 10

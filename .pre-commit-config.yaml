repos:
  - repo: local
    hooks:
      - id: pylint
        name: pylint (uv)
        entry: uv run pylint src
        language: system
        pass_filenames: false
      - id: mypy
        name: mypy (uv)
        entry: uv run mypy src
        language: system
        pass_filenames: false
      - id: black-check
        name: black --check (uv)
        entry: uv run black --check src tests
        language: system
        pass_filenames: false
      - id: pytest
        name: pytest (uv)
        entry: uv run pytest -q
        language: system
        pass_filenames: false
